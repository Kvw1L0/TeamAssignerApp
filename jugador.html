<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asignación de Equipos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evita el scroll en móviles */
        }

        /* Estilos del Video de Fondo */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        /* Capa oscura sobre el video para que el texto se lea bien */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* Contenedor Principal */
        .main-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Cajas de contenido con fondo sólido para destacar sobre el video */
        .content-box {
            background-color: #212529;
            border: 2px solid #ffc107;
            border-radius: 12px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            color: white;
        }

        .text-warning { color: #ffc107 !important; }
        
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px;
            border-radius: 8px;
        }

        .form-control {
            background-color: #121212;
            border: 1px solid #444;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #000;
            border-color: #ffc107;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }

        /* Animación de Suspenso */
        .spinner-border {
            width: 4rem;
            height: 4rem;
            color: #ffc107;
            margin-bottom: 15px;
        }

        /* Pantallas ocultas por defecto */
        #screen-loading, #screen-result {
            display: none;
        }

        /* Estilo del resultado final */
        .team-number {
            font-size: 5rem;
            font-weight: 900;
            color: #121212;
            background-color: #ffc107;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            line-height: 120px;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
        }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-connection-lines-loop-27383-large.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="main-container">

    <div id="screen-input" class="content-box">
        <h3 class="mb-3 fw-bold">UNIRSE AL <span class="text-warning">DESAFÍO</span></h3>
        <p class="text-secondary small mb-4">Ingresa tu nombre para descubrir tu equipo.</p>
        
        <input type="text" id="playerName" class="form-control mb-4" placeholder="Tu Nombre">
        
        <button class="btn btn-warning w-100" onclick="solicitarEquipo()">DESCUBRIR EQUIPO</button>
    </div>

    <div id="screen-loading" class="content-box">
        <div class="spinner-border" role="status"></div>
        <h4 class="fw-bold text-warning mt-3">Sincronizando...</h4>
        <p class="text-light">Asignando tu lugar en la base de datos</p>
    </div>

    <div id="screen-result" class="content-box">
        <h4 class="fw-bold text-light">PERTENECES AL</h4>
        <div class="text-warning fs-5 fw-bold mb-2">EQUIPO NÚMERO</div>
        <div id="finalTeamDisplay" class="team-number">X</div>
        <p id="welcomeMessage" class="mt-3 fw-bold"></p>
        <p class="small text-secondary mt-4">Mira la pantalla gigante.</p>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 🚨 REEMPLAZA CON TUS LLAVES DE FIREBASE 🚨
    const firebaseConfig = {

    apiKey: "AIzaSyCgwypR7eC6w3U8eUUvuRBKGjSkUtw95CQ",

    authDomain: "teamassignerapp.firebaseapp.com",

    databaseURL: "https://teamassignerapp-default-rtdb.firebaseio.com",

    projectId: "teamassignerapp",

    storageBucket: "teamassignerapp.firebasestorage.app",

    messagingSenderId: "443890843534",

    appId: "1:443890843534:web:0049c943485c677af12edf"

  };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Comprobar Anti-Trampas (si ya tiene un equipo guardado en este celular)
    window.onload = function() {
        const equipoGuardado = localStorage.getItem('equipoAsignado');
        const nombreGuardado = localStorage.getItem('nombreJugador');
        
        if (equipoGuardado && nombreGuardado) {
            mostrarResultado(equipoGuardado, nombreGuardado);
        }
    };

    function solicitarEquipo() {
        const nombreInput = document.getElementById('playerName').value.trim();
        
        if (nombreInput === "") {
            alert("Por favor, ingresa tu nombre.");
            return;
        }

        // Cambiar a pantalla de "Calculando..."
        document.getElementById('screen-input').style.display = 'none';
        document.getElementById('screen-loading').style.display = 'block';

        // Lógica para tomar un cupo de Firebase
        const eventoRef = database.ref('evento');
        
        eventoRef.once('value', (snapshot) => {
            const data = snapshot.val();
            
            if (!data || !data.cupos_disponibles || data.cupos_disponibles.length === 0) {
                alert("¡Lo sentimos! Ya no quedan cupos disponibles.");
                document.getElementById('screen-loading').style.display = 'none';
                document.getElementById('screen-input').style.display = 'block';
                return;
            }

            // Tomamos la lista de cupos actuales
            let cupos = data.cupos_disponibles;
            
            // Extraemos el primer cupo de la lista mezclada
            let miEquipo = cupos.shift(); 

            // Actualizamos la base de datos con la lista reducida y agregamos al participante
            let actualizaciones = {};
            actualizaciones['/evento/cupos_disponibles'] = cupos;
            
            // Usamos un ID único basado en el tiempo para que no se sobreescriban los nombres
            const idUnico = Date.now();
            actualizaciones['/evento/participantes/equipo_' + miEquipo + '/' + idUnico] = nombreInput;

            database.ref().update(actualizaciones).then(() => {
                // Generar un poco de suspenso artificial (2 segundos)
                setTimeout(() => {
                    // Guardar en la memoria del celular
                    localStorage.setItem('equipoAsignado', miEquipo);
                    localStorage.setItem('nombreJugador', nombreInput);
                    
                    mostrarResultado(miEquipo, nombreInput);
                }, 2000);
            }).catch((error) => {
                alert("Error de conexión, intenta de nuevo.");
                location.reload();
            });
        });
    }

    function mostrarResultado(equipo, nombre) {
        document.getElementById('screen-input').style.display = 'none';
        document.getElementById('screen-loading').style.display = 'none';
        
        const screenResult = document.getElementById('screen-result');
        screenResult.style.display = 'block';
        
        document.getElementById('finalTeamDisplay').innerText = equipo;
        document.getElementById('welcomeMessage').innerText = `¡Bienvenido/a, ${nombre}!`;
    }
</script>

</body>
</html>
